<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wall Dashboard</title>
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <section class="screen" id="screen-clock" data-screen="clock">
      <div id="clock-time">--:--</div>
      <div id="clock-date"></div>
    </section>

    <section class="screen" id="screen-weather" data-screen="weather">
      <div id="weather-scene" aria-hidden="true"></div>
      <div class="label" id="weather-place"></div>
      <div id="weather-now">
        <span id="weather-icon"></span>
        <span id="weather-temp">--</span>
      </div>
      <div id="weather-desc"></div>
      <div id="weather-days"></div>
    </section>

    <section class="screen" id="screen-scores" data-screen="scores">
      <div class="label">Scores</div>
      <div id="scores-body"></div>
    </section>

    <section class="screen" id="screen-fantasy" data-screen="fantasy">
      <div class="label">Fantasy</div>
      <div id="fantasy-body"></div>
    </section>
    <section class="screen" id="screen-photos" data-screen="photos">
      <div id="photo-bg"></div>
      <img id="photo-img" alt="">
    </section>
  </main>

  <footer id="dots"></footer>
  <div id="status"></div>
  <div id="night"></div>

  <a id="gear" href="settings.html" aria-label="Settings">&#9881;</a>

  <script src="shared.js"></script>
  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
